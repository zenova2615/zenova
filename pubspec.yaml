name: zenova
description: ZENOVA Media - Premium AMOLED Android Media Ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ^2.4.0
  permission_handler: ^11.3.1
  photo_manager: ^3.12.0
  path: ^1.9.0
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8
  flutter_volume_controller: ^1.3.3
  screen_brightness: ^1.0.1
  gallery_saver_plus: ^3.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  
